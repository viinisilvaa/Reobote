# Gera o APK do aplicativo REOBOTE na nuvem do GitHub (gratuito para repositórios).
#
# Quando roda:
#   - automaticamente, a cada envio (push) que altere o aplicativo (pastas app/, compartilhado/ ou aplicativo-android/);
#   - manualmente, na aba "Actions" do repositório > "Gerar APK do aplicativo" > "Run workflow".
#
# Resultado:
#   - o arquivo reobote.apk fica publicado em "Releases" do repositório;
#   - o link fixo para a versão mais recente é:
#       https://github.com/USUARIO/REPOSITORIO/releases/latest/download/reobote.apk
#     (cole esse link em Central > Configurações > "Link de download do APK").

name: Gerar APK do aplicativo

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "compartilhado/**"
      - "aplicativo-android/**"
      - ".github/workflows/gerar-apk.yml"

# Permissão para criar a publicação (Release) com o APK.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicativo-android
    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v4

      - name: Instalar Node.js (necessário para o Capacitor)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java 17 (necessário para compilar Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências do Capacitor
        run: npm install

      - name: Copiar o aplicativo para dentro do projeto Android
        run: npm run preparar

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Configurar permissões (câmera e localização), ícone e versão
        env:
          VERSAO_APP: ${{ github.run_number }}
        run: npm run android:configurar

      - name: Sincronizar os arquivos com o projeto Android
        run: npx cap sync android

      # O SDK do Android já vem instalado nas máquinas do GitHub. O APK de depuração é assinado
      # automaticamente e pode ser instalado diretamente nos celulares.
      - name: Compilar o APK
        working-directory: aplicativo-android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../reobote.apk

      - name: Guardar o APK nos artefatos desta execução
        uses: actions/upload-artifact@v4
        with:
          name: reobote-apk
          path: aplicativo-android/reobote.apk

      - name: Publicar o APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Aplicativo REOBOTE ${{ github.run_number }}
          body: |
            APK do aplicativo REOBOTE gerado automaticamente.
            Para instalar: baixe reobote.apk no celular Android e permita a instalação de apps desta fonte.
          files: aplicativo-android/reobote.apk
          make_latest: true
